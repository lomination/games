name: Coverage

on:
  workflow_call:
  workflow_dispatch:

jobs:
  coverage:
    name: Run coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:1.21
          apps: sbt

      - name: Run coverage
        run: sbt coverage test coverageReport

